name: custom_country_state_city
description: Flutter widget to pick a country, state and city from strict dropdowns, with search, 246 countries, 48k+ cities, i18n (fr/en) and theme-aware dialogs.
version: 1.1.2
homepage: https://github.com/TchatchoKemajou/custom_country_state_city
repository: https://github.com/TchatchoKemajou/custom_country_state_city
issue_tracker: https://github.com/TchatchoKemajou/custom_country_state_city/issues

environment:
  sdk: ">=2.19.2 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# The following section is specific to Flutter.
flutter:
  assets:
    - packages/custom_country_state_city/assets/fr/country.json
    - packages/custom_country_state_city/assets/en/country.json
    - packages/custom_country_state_city/assets/en/state.json
    - packages/custom_country_state_city/assets/en/city.json
